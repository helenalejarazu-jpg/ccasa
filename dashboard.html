<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Kuorum — Seguimiento POA</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6B2D8B;--m:#C2185B;--o:#E8573A;--g:#16A34A;--am:#D97706;--sl:#64748B;--bg:#FAF9F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:#1E1B2E;min-height:100vh}
.hd{font-family:'Comfortaa',cursive}.gt{background:linear-gradient(135deg,#6B2D8B,#C2185B,#E8573A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 12px rgba(107,45,139,.06);border:1px solid rgba(107,45,139,.07);padding:20px;margin-bottom:16px}
.btn{font-family:'Comfortaa',cursive;font-weight:600;border:none;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:9px 22px}
.btn-p{background:linear-gradient(135deg,#6B2D8B,#C2185B,#E8573A);color:#fff}.btn-p:hover{opacity:.9}.btn-p:disabled{opacity:.5;cursor:wait}
.btn-g{background:transparent;color:var(--p);padding:7px 14px}.btn-g:hover{background:rgba(107,45,139,.07)}
.sel{font-family:'Manrope';border:1.5px solid #E0D6EA;border-radius:9px;padding:7px 12px;font-size:13px;background:#fff;outline:none}.sel:focus{border-color:var(--p)}
.nav-btn{font-family:'Comfortaa',cursive;font-size:12px;font-weight:600;padding:7px 16px;border-radius:9px;cursor:pointer;border:none;background:transparent;color:#6B6B80}
.nav-btn:hover{background:rgba(107,45,139,.07);color:var(--p)}.nav-active{background:rgba(107,45,139,.12)!important;color:var(--m)!important}
.badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600}
.b-r{background:#DCFCE7;color:var(--g)}.b-c{background:#FEF3C7;color:var(--am)}.b-p{background:#F1F5F9;color:var(--sl)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{background:#F8F5FB;color:var(--p);font-weight:700;text-align:left;padding:9px 12px;border-bottom:2px solid #E0D6EA;font-family:'Comfortaa',cursive;font-size:11px}
.tbl td{padding:9px 12px;border-bottom:1px solid #F0ECF4;cursor:pointer}.tbl tr:hover td{background:#FDFBFE}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar-track{height:20px;background:#F0ECF4;border-radius:4px;overflow:hidden;display:flex;flex:1}
.bar-seg{height:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;display:none}
.modal{background:#fff;border-radius:18px;max-width:720px;width:94%;max-height:88vh;overflow-y:auto;padding:28px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;font-family:'Manrope'}
.cal-day:hover{transform:scale(1.08)}.cal-real{background:rgba(22,163,74,.12);color:var(--g);font-weight:700}.cal-proy{background:rgba(107,45,139,.1);color:var(--p);font-weight:700}
header{background:#fff;border-bottom:1px solid #E8E0F0;padding:0 20px;position:sticky;top:0;z-index:50}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;height:50px}
main{max-width:1100px;margin:0 auto;padding:20px 20px 50px}
.hidden{display:none!important}
.si{font-family:'Manrope';border:1.5px solid #E0D6EA;border-radius:9px;padding:7px 12px;font-size:13px;background:#fff;outline:none;width:100%}.si:focus{border-color:var(--p)}
.update-info{font-size:10px;color:#999;font-family:'Manrope'}
</style>
</head>
<body>

<div id="app">
<header><div class="header-inner">
<span class="hd gt" style="font-size:18px;font-weight:700">red kuorum</span>
<nav id="navbtns" style="display:flex;gap:3px"></nav>
<span class="update-info" id="updateInfo"></span>
</div></header>
<main>
<div style="margin-bottom:16px"><h1 class="hd" style="font-size:20px" id="ptitle">Panel de seguimiento</h1>
<p style="font-size:12px;color:#999;margin-top:3px" id="psub"></p></div>
<div id="page-dash"></div><div id="page-med" class="hidden"></div><div id="page-cal" class="hidden"></div><div id="page-rep" class="hidden"></div>
</main></div>

<div id="modal-bg" class="overlay"><div class="modal" id="modal-box" onclick="event.stopPropagation()"></div></div>

<script src="data.js?v=20260526"></script>
<script>
var calMonth=new Date().getMonth();
var calYear=new Date().getFullYear();
var aiC={};
var aiG='';
var PAGES=['dash','med','cal','rep'];
var PTITLES={dash:'Panel de seguimiento',med:'Detalle de medidas',cal:'Calendario',rep:'Informe del POA'};
var PLABELS={dash:'Dashboard',med:'Medidas',cal:'Calendario',rep:'Informe'};

function parseDates(txt){if(!txt)return[];if(txt instanceof Date&&!isNaN(txt))return[txt];var parts=txt.toString().trim().split(';');var dates=[];for(var i=0;i<parts.length;i++){var p=parts[i].trim();if(!p)continue;var m=p.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){var y=parseInt(m[3]);if(y<100)y+=2000;dates.push(new Date(y,parseInt(m[2])-1,parseInt(m[1])));continue;}m=p.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)dates.push(new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])));}return dates;}
function gS(s){var v=(s||'').toLowerCase().trim();if(v==='realizada')return{c:'#16A34A',cls:'b-r',l:'Realizada'};if(v==='en curso')return{c:'#D97706',cls:'b-c',l:'En curso'};return{c:'#64748B',cls:'b-p',l:'Por abordar'};}
function bdg(s){var st=gS(s);return '<span class="badge '+st.cls+'">'+st.l+'</span>';}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function short(s,n){return(s||'').substring(0,n);}
function getAreas(d){var a=[];var seen={};var arr=d||DATA;for(var i=0;i<arr.length;i++){var v=arr[i].area;if(v&&!seen[v]){seen[v]=1;a.push(v);}}return a;}
function countS(arr){var r=0,c=0,p=0;for(var i=0;i<arr.length;i++){var l=gS(arr[i].cumplimiento).l;if(l==='Realizada')r++;else if(l==='En curso')c++;else p++;}return{r:r,c:c,p:p};}
function sumH(arr,k){var s=0;for(var i=0;i<arr.length;i++)s+=(parseFloat(arr[i][k])||0);return s;}

function openModal(idx){
  var d=DATA[idx];if(!d)return;
  var st=gS(d.cumplimiento);
  var num=(d.area||'').match(/^(\d+)\./);num=num?num[0]:'';
  var h='';
  h+='<div style="margin:-28px -28px 0 -28px;padding:24px 28px 20px;background:linear-gradient(135deg,'+st.c+'15,'+st.c+'05);border-bottom:3px solid '+st.c+';border-radius:18px 18px 0 0">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
  h+='<div style="flex:1"><span style="font-size:10px;font-weight:700;color:'+st.c+';text-transform:uppercase;letter-spacing:1px">Area '+num+'</span>';
  h+='<h2 class="hd" style="font-size:17px;margin:6px 0 10px;line-height:1.3;color:#1E1B2E">'+esc(d.medida)+'</h2>';
  h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+bdg(d.cumplimiento);
  if(d.responsable)h+='<span style="font-size:11px;color:#666;background:#fff;padding:3px 10px;border-radius:8px">'+esc(d.responsable)+'</span>';
  h+='</div></div>';
  h+='<button class="btn btn-g" onclick="closeModal()" style="padding:6px;font-size:20px;flex-shrink:0">&times;</button></div></div>';
  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 16px">';
  var metrics=[['F. proyectada',(d.fecha_proy||'').toString(),'#6B2D8B'],['F. realizada',(d.fecha_real||'').toString(),'#16A34A'],['Horas prog.',(d.horas_prog||'').toString(),'#C2185B'],['Horas reales',(d.horas_real||'').toString(),'#D97706'],['Presupuesto',d.presupuesto?d.presupuesto+' €':'','#E8573A']];
  for(var i=0;i<metrics.length;i++){if(!metrics[i][1])continue;h+='<div style="background:#F8F5FB;border-radius:10px;padding:10px 14px;flex:1;min-width:110px"><div style="font-size:9px;font-weight:700;color:'+metrics[i][2]+';text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">'+metrics[i][0]+'</div><div style="font-size:13px;font-weight:600;color:#333">'+esc(metrics[i][1])+'</div></div>';}
  h+='</div>';
  h+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">';
  h+='<div style="flex:1;min-width:240px;background:#F8F5FB;border-radius:12px;padding:16px;border-top:3px solid #6B2D8B">';
  h+='<div style="font-size:10px;font-weight:700;color:#6B2D8B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">&#9654; Accion proyectada</div>';
  h+='<div style="font-size:13px;line-height:1.7;color:#333;white-space:pre-wrap">'+(esc(d.desc_proy)||'<span style="color:#BBB">Sin descripcion</span>')+'</div></div>';
  var realColor=d.desc_real?'#16A34A':'#94A3B8';
  h+='<div style="flex:1;min-width:240px;background:'+(d.desc_real?'#F0FDF4':'#F8FAFC')+';border-radius:12px;padding:16px;border-top:3px solid '+realColor+'">';
  h+='<div style="font-size:10px;font-weight:700;color:'+realColor+';text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">&#10003; Accion realizada</div>';
  h+='<div style="font-size:13px;line-height:1.7;color:#333;white-space:pre-wrap">'+(esc(d.desc_real)||'<span style="color:#BBB">Sin realizar</span>')+'</div></div>';
  h+='</div>';
  if(d.tareas&&d.tareas!=='Sin tareas pendientes'){
    h+='<div style="background:#FFFBEB;border-radius:12px;padding:16px;margin-bottom:16px;border-left:3px solid #D97706">';
    h+='<div style="font-size:10px;font-weight:700;color:#D97706;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">&#9888; Tareas pendientes</div>';
    h+='<div style="font-size:13px;line-height:1.7;color:#92400E;white-space:pre-wrap">'+esc(d.tareas)+'</div></div>';}
  var extras=[];
  if(d.indicador)extras.push(['Indicador de seguimiento',d.indicador]);
  if(d.meta)extras.push(['Meta estrategica',d.meta]);
  if(d.evidencia)extras.push(['Documentos de evidencia',d.evidencia]);
  if(d.desc_estado)extras.push(['Descripcion de estado',d.desc_estado]);
  if(extras.length){h+='<div style="border-top:1px solid #F0ECF4;padding-top:14px">';
    for(var i=0;i<extras.length;i++){h+='<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:700;color:#6B2D8B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">'+extras[i][0]+'</div><div style="font-size:12px;line-height:1.6;color:#555;white-space:pre-wrap">'+esc(extras[i][1])+'</div></div>';}
    h+='</div>';}
  document.getElementById('modal-box').innerHTML=h;
  document.getElementById('modal-bg').style.display='flex';
}
function closeModal(){document.getElementById('modal-bg').style.display='none';}
document.getElementById('modal-bg').onclick=function(){closeModal();};

function showPage(p){
  for(var i=0;i<PAGES.length;i++){
    document.getElementById('page-'+PAGES[i]).className=(PAGES[i]===p)?'':'hidden';
    var btns=document.querySelectorAll('.nav-btn');
    for(var j=0;j<btns.length;j++){btns[j].className='nav-btn'+(btns[j].getAttribute('data-page')===p?' nav-active':'');}
  }
  document.getElementById('ptitle').textContent=PTITLES[p];
}

function buildNav(){
  var nav=document.getElementById('navbtns');
  var h='';
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    h+='<button class="nav-btn'+(p==='dash'?' nav-active':'')+'" data-page="'+p+'" onclick="showPage(\''+p+'\')">'+PLABELS[p]+'</button>';
  }
  nav.innerHTML=h;
}

function renderDash(){
  var areas=getAreas();
  var h='<div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center">';
  h+='<select class="sel" id="da" onchange="renderDC()"><option value="">Todas las áreas</option>';
  for(var i=0;i<areas.length;i++)h+='<option value="'+esc(areas[i])+'">'+esc(areas[i])+'</option>';
  h+='</select></div><div id="dc"></div>';
  document.getElementById('page-dash').innerHTML=h;
  renderDC();
}

function renderDC(){
  var fa=(document.getElementById('da')||{}).value||'';
  var fd=[];for(var i=0;i<DATA.length;i++){if(!fa||DATA[i].area===fa)fd.push(DATA[i]);}
  var s=countS(fd);var hp=sumH(fd,'horas_prog');var hr=sumH(fd,'horas_real');
  var now=new Date();
  var overdue=[];
  for(var i=0;i<fd.length;i++){
    var cumpl=gS(fd[i].cumplimiento).l;
    if(cumpl==='Realizada'||cumpl==='En curso')continue;
    var hasReal=parseDates(fd[i].fecha_real).length>0;
    if(hasReal)continue;
    var ds=parseDates(fd[i].fecha_proy);
    for(var j=0;j<ds.length;j++){if(ds[j]<now){overdue.push(fd[i]);break;}}
  }

  var h='<div class="kpi">';
  h+=kpi('Medidas activas',fd.length,'#6B2D8B')+kpi('Realizadas',s.r,'#16A34A')+kpi('En curso',s.c,'#D97706')+kpi('Por abordar',s.p,'#64748B');
  h+='</div>';
  h+='<div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap"><div class="card" style="padding:8px 16px;font-size:12px;color:#666;margin-bottom:0">Horas prog: <b style="color:#6B2D8B">'+hp+'</b></div><div class="card" style="padding:8px 16px;font-size:12px;color:#666;margin-bottom:0">Horas reales: <b style="color:#16A34A">'+hr+'</b></div></div>';

  if(overdue.length>0){
    h+='<div class="card" style="border-left:3px solid #E8573A;background:#FFF7ED"><b style="color:#E8573A;font-size:12px">&#9888; '+overdue.length+' medida'+(overdue.length>1?'s':'')+' con fecha superada</b><br>';
    for(var i=0;i<Math.min(overdue.length,5);i++){var idx=DATA.indexOf(overdue[i]);h+='<span style="cursor:pointer;color:#92400E;font-size:11px" onclick="openModal('+idx+')">- '+esc(short(overdue[i].medida,80))+'</span><br>';}
    h+='</div>';
  }

  h+='<div class="card"><h3 class="hd" style="font-size:13px;margin-bottom:12px">Estado por áreas</h3>';
  var areas=getAreas(fd);
  for(var a=0;a<areas.length;a++){
    var am=[];for(var i=0;i<fd.length;i++){if(fd[i].area===areas[a])am.push(fd[i]);}
    var cs=countS(am);var t=am.length||1;var num=(areas[a].match(/^(\d+)\./)||['',''])[1];
    h+='<div style="display:flex;align-items:center;margin-bottom:8px;font-size:12px"><span style="width:50px;font-weight:600;color:#666">A'+num+'</span><div class="bar-track"><div class="bar-seg" style="width:'+Math.round(cs.r/t*100)+'%;background:#16A34A"></div><div class="bar-seg" style="width:'+Math.round(cs.c/t*100)+'%;background:#D97706"></div><div class="bar-seg" style="width:'+Math.round(cs.p/t*100)+'%;background:#94A3B8"></div></div><span style="width:80px;text-align:right;font-size:11px;color:#888;padding-left:8px">'+cs.r+'/'+cs.c+'/'+cs.p+'</span></div>';
  }
  h+='<div style="font-size:10px;color:#888;margin-top:6px"><span style="color:#16A34A">&#9632;</span> Real / <span style="color:#D97706">&#9632;</span> Curso / <span style="color:#94A3B8">&#9632;</span> Pendiente</div></div>';

  var realizadas=[];var encurso=[];var porabordar=[];
  for(var i=0;i<fd.length;i++){var l=gS(fd[i].cumplimiento).l;if(l==='Realizada')realizadas.push(fd[i]);else if(l==='En curso')encurso.push(fd[i]);else porabordar.push(fd[i]);}

  function statusSection(title,icon,color,bgLight,items){
    var s='<div style="flex:1;min-width:280px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:18px">'+icon+'</span><h3 class="hd" style="font-size:14px;margin:0;color:'+color+'">'+title+'</h3><span style="background:'+color+';color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px">'+items.length+'</span></div>';
    if(!items.length){s+='<div class="card" style="padding:20px;text-align:center;color:#BBB;font-size:12px;border-top:3px solid '+color+'">Sin medidas</div>';return s+'</div>';}
    for(var i=0;i<items.length;i++){var d=items[i];var idx=DATA.indexOf(d);var num=(d.area||'').match(/^(\d+)\./);num=num?num[0]:'';
      s+='<div class="card" style="padding:14px 16px;cursor:pointer;border-left:3px solid '+color+';margin-bottom:8px" onclick="openModal('+idx+')">';
      s+='<div style="font-weight:700;font-size:12px;color:#1E1B2E;margin-bottom:4px;line-height:1.4">'+esc(short(d.medida,85))+'</div>';
      s+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
      s+='<span style="font-size:10px;color:#888;background:#F0ECF4;padding:2px 8px;border-radius:6px">Área '+num+'</span>';
      if(d.responsable)s+='<span style="font-size:10px;color:#888">'+esc(short(d.responsable,30))+'</span>';
      s+='</div></div>';}
    return s+'</div>';
  }

  h+='<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:4px">';
  h+=statusSection('Realizadas','&#10003;','#16A34A','#DCFCE7',realizadas);
  h+=statusSection('En curso','&#9679;','#D97706','#FEF3C7',encurso);
  h+=statusSection('Por abordar','&#9675;','#64748B','#F1F5F9',porabordar);
  h+='</div>';
  document.getElementById('dc').innerHTML=h;
}

function kpi(label,val,color){return '<div class="card" style="flex:1;min-width:140px;padding:16px 20px;margin-bottom:0"><div style="font-size:10px;font-weight:600;color:#8B8BA0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">'+label+'</div><div class="hd" style="font-size:24px;font-weight:700;color:'+color+'">'+val+'</div></div>';}

function renderMed(){
  var areas=getAreas();
  var h='<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
  h+='<input class="si" style="flex:1;min-width:200px" placeholder="Buscar medida..." id="mq" oninput="renderMC()">';
  h+='<select class="sel" id="ma" onchange="renderMC()"><option value="">Todas las áreas</option>';
  for(var i=0;i<areas.length;i++)h+='<option>'+esc(areas[i])+'</option>';
  h+='</select><select class="sel" id="ms" onchange="renderMC()"><option value="">Todos</option><option>Realizada</option><option>En curso</option><option>Por abordar</option></select></div></div><div id="mc"></div>';
  document.getElementById('page-med').innerHTML=h;
  renderMC();
}

function renderMC(){
  var q=(document.getElementById('mq')||{}).value||'';q=q.toLowerCase();
  var fa=(document.getElementById('ma')||{}).value||'';
  var fs=(document.getElementById('ms')||{}).value||'';
  var now=new Date();var fd=[];
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    if(fa&&d.area!==fa)continue;if(fs&&gS(d.cumplimiento).l!==fs)continue;
    if(q&&(d.medida||'').toLowerCase().indexOf(q)===-1&&(d.desc_proy||'').toLowerCase().indexOf(q)===-1&&(d.responsable||'').toLowerCase().indexOf(q)===-1)continue;
    fd.push(d);}
  var h='<div class="card" style="overflow-x:auto"><p style="font-size:12px;color:#888;margin-bottom:10px">'+fd.length+' medidas</p><table class="tbl"><thead><tr><th>Medida</th><th>Área</th><th>Estado</th><th>Responsable</th><th>Pendiente</th></tr></thead><tbody>';
  for(var i=0;i<fd.length;i++){var d=fd[i];var idx=DATA.indexOf(d);
    var ov=gS(d.cumplimiento).l==='Por abordar'&&parseDates(d.fecha_real).length===0&&parseDates(d.fecha_proy).some(function(dt){return dt<now;});
    h+='<tr onclick="openModal('+idx+')" style="background:'+(ov?'#FFF7ED':'')+'"><td style="font-weight:600;font-size:12px;max-width:260px">'+(ov?'&#9888; ':'')+esc(short(d.medida,80))+'</td><td style="font-size:11px">'+((d.area||'').match(/^\d+\./)||[''])[0]+'</td><td>'+bdg(d.cumplimiento)+'</td><td style="font-size:11px">'+esc(short(d.responsable,40))+'</td><td style="font-size:11px;color:#888">'+esc(short(d.tareas||'—',50))+'</td></tr>';}
  h+='</tbody></table></div>';
  document.getElementById('mc').innerHTML=h;
}

function renderCal(){renderCC();}
function renderCC(){
  var now=new Date();var evts=[];
  var MF=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var DL=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    var dr=parseDates(d.fecha_real);for(var j=0;j<dr.length;j++)evts.push({date:dr[j],idx:i,type:'real'});
    if(gS(d.cumplimiento).l!=='Realizada'){var dp=parseDates(d.fecha_proy);for(var j=0;j<dp.length;j++)evts.push({date:dp[j],idx:i,type:'proy'});}
    else if(!dr.length){var dp=parseDates(d.fecha_proy);for(var j=0;j<dp.length;j++)evts.push({date:dp[j],idx:i,type:'proy'});}}
  var first=new Date(calYear,calMonth,1);var sd=first.getDay()-1;if(sd<0)sd=6;
  var dim=new Date(calYear,calMonth+1,0).getDate();

  var h='<div style="display:flex;gap:18px;flex-wrap:wrap"><div class="card" style="flex:2;min-width:280px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="btn btn-g" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCC()">&#9664;</button><h3 class="hd" style="font-size:15px">'+MF[calMonth]+' '+calYear+'</h3><button class="btn btn-g" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCC()">&#9654;</button></div>';
  h+='<div class="cal-grid" style="margin-bottom:5px">';
  for(var i=0;i<DL.length;i++)h+='<div style="text-align:center;font-size:10px;font-weight:700;color:#AAA;padding:3px">'+DL[i]+'</div>';
  h+='</div><div class="cal-grid">';
  for(var i=0;i<sd;i++)h+='<div></div>';
  for(var day=1;day<=dim;day++){
    var de=[];for(var j=0;j<evts.length;j++){var e=evts[j];if(e.date.getMonth()===calMonth&&e.date.getFullYear()===calYear&&e.date.getDate()===day)de.push(e);}
    var hasR=false,hasP=false;for(var j=0;j<de.length;j++){if(de[j].type==='real')hasR=true;else hasP=true;}
    var cls=hasR?'cal-real':hasP?'cal-proy':'';
    var oc=de.length>0?'onclick="openModal('+de[0].idx+')"':'';
    h+='<button class="cal-day '+cls+'" '+oc+'>'+day+'</button>';}
  h+='</div><div style="display:flex;gap:14px;margin-top:10px;font-size:10px;color:#888"><span><span style="color:#16A34A">&#9632;</span> Realizada</span><span><span style="color:#6B2D8B">&#9632;</span> Proyectada</span></div></div>';

  h+='<div class="card" style="flex:1;min-width:240px"><h3 class="hd" style="font-size:13px;margin-bottom:12px">Próximas medidas</h3>';
  var up=[];for(var i=0;i<evts.length;i++){if(evts[i].type==='proy'&&evts[i].date>=now)up.push(evts[i]);}
  up.sort(function(a,b){return a.date-b.date;});
  if(up.length>10)up=up.slice(0,10);
  if(up.length){for(var i=0;i<up.length;i++){var d=DATA[up[i].idx];h+='<div style="padding:8px 0;border-bottom:1px solid #F0ECF4;cursor:pointer;font-size:12px" onclick="openModal('+up[i].idx+')"><div style="font-weight:600;color:#333;margin-bottom:2px">'+esc(short(d.medida,70))+'</div><div style="font-size:11px;color:#6B2D8B">'+up[i].date.getDate()+' '+MS[up[i].date.getMonth()]+' '+up[i].date.getFullYear()+'</div></div>';}}
  else h+='<p style="color:#BBB;font-size:12px">No hay medidas pendientes con fecha</p>';
  h+='</div></div>';
  document.getElementById('page-cal').innerHTML=h;
}

function renderRep(){
  var areas=getAreas();
  var h='<div class="card"><h3 class="hd" style="font-size:15px;margin-bottom:8px">Generación de informe</h3>';
  h+='<p style="font-size:12px;color:#888;margin-bottom:14px">Genera el análisis narrativo y descarga el borrador del informe.</p>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><select class="sel" id="ra"><option value="">Todas las áreas</option>';
  for(var i=0;i<areas.length;i++)h+='<option>'+esc(areas[i])+'</option>';
  h+='</select></div>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-p" style="background:#6B2D8B" onclick="dlReport()">&#8681; Descargar informe</button></div></div>';
  h+='<div id="rc"></div>';
  document.getElementById('page-rep').innerHTML=h;
  renderRC();
}

function renderRC(){
  var fa=(document.getElementById('ra')||{}).value||'';
  var fd=[];for(var i=0;i<DATA.length;i++){if(!fa||DATA[i].area===fa)fd.push(DATA[i]);}
  var areas=getAreas(fd);
  var h='<div class="card"><h3 class="hd" style="font-size:13px;margin-bottom:14px">'+fd.length+' medidas en '+areas.length+' áreas</h3>';
  for(var a=0;a<areas.length;a++){
    var am=[];for(var i=0;i<fd.length;i++){if(fd[i].area===areas[a])am.push(fd[i]);}
    var cs=countS(am);var t=am.length||1;var hp=sumH(am,'horas_prog');var hr=sumH(am,'horas_real');
    h+='<div style="margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #F0ECF4">';
    h+='<h4 class="hd gt" style="font-size:14px;margin-bottom:6px">'+esc(areas[a])+'</h4>';
    h+='<div style="font-size:11px;color:#888;margin-bottom:8px">Horas prog: <b>'+hp+'</b> · Horas real: <b>'+hr+'</b></div>';
    h+='<div style="display:flex;align-items:center;margin-bottom:8px"><div class="bar-track"><div class="bar-seg" style="width:'+Math.round(cs.r/t*100)+'%;background:#16A34A"></div><div class="bar-seg" style="width:'+Math.round(cs.c/t*100)+'%;background:#D97706"></div><div class="bar-seg" style="width:'+Math.round(cs.p/t*100)+'%;background:#94A3B8"></div></div><span style="width:80px;text-align:right;font-size:11px;color:#888;padding-left:8px">'+cs.r+'R/'+cs.c+'C/'+cs.p+'P</span></div>';
    h+='<table class="tbl"><thead><tr><th>Medida</th><th>Estado</th><th>Pendiente</th></tr></thead><tbody>';
    for(var i=0;i<am.length;i++)h+='<tr><td style="font-weight:600;font-size:11px">'+esc(short(am[i].medida,80))+'</td><td>'+bdg(am[i].cumplimiento)+'</td><td style="font-size:11px;color:#888">'+esc(short(am[i].tareas||'—',60))+'</td></tr>';
    h+='</tbody></table></div>';}
  h+='</div>';
  document.getElementById('rc').innerHTML=h;
}

    h+='<p style="font-size:12px">Medidas: '+t+' | R: '+cs.r+' | C: '+cs.c+' | P: '+cs.p+' | Horas: '+ahp+'/'+ahr+'</p>';
    for(var i=0;i<am.length;i++){var d=am[i];var stC=gS(d.cumplimiento).c;
      h+='<div class="bl" style="border-left:3px solid '+stC+'"><p style="margin:0 0 6px"><b>'+esc(d.medida)+'</b></p>';
      if(d.desc_proy)h+='<p>'+esc(d.desc_proy)+'</p>';

      if(d.evidencia)h+='<p style="font-size:11px;color:#888"><b>Evidencias:</b> '+esc(d.evidencia)+'</p>';

  }
