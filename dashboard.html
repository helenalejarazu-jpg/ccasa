<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Kuorum — Seguimiento POA</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6B2D8B;--m:#C2185B;--o:#E8573A;--g:#16A34A;--am:#D97706;--sl:#64748B;--bg:#FAF9F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:#1E1B2E;min-height:100vh}
.hd{font-family:'Comfortaa',cursive}.gt{background:linear-gradient(135deg,#6B2D8B,#C2185B,#E8573A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 12px rgba(107,45,139,.06);border:1px solid rgba(107,45,139,.07);padding:20px;margin-bottom:16px}
.btn{font-family:'Comfortaa',cursive;font-weight:600;border:none;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:9px 22px}
.btn-p{background:linear-gradient(135deg,#6B2D8B,#C2185B,#E8573A);color:#fff}.btn-p:hover{opacity:.9}.btn-p:disabled{opacity:.5;cursor:wait}
.btn-g{background:transparent;color:var(--p);padding:7px 14px}.btn-g:hover{background:rgba(107,45,139,.07)}
.sel{font-family:'Manrope';border:1.5px solid #E0D6EA;border-radius:9px;padding:7px 12px;font-size:13px;background:#fff;outline:none}.sel:focus{border-color:var(--p)}
.nav-btn{font-family:'Comfortaa',cursive;font-size:12px;font-weight:600;padding:7px 16px;border-radius:9px;cursor:pointer;border:none;background:transparent;color:#6B6B80}
.nav-btn:hover{background:rgba(107,45,139,.07);color:var(--p)}.nav-active{background:rgba(107,45,139,.12)!important;color:var(--m)!important}
.badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600}
.b-r{background:#DCFCE7;color:var(--g)}.b-c{background:#FEF3C7;color:var(--am)}.b-p{background:#F1F5F9;color:var(--sl)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{background:#F8F5FB;color:var(--p);font-weight:700;text-align:left;padding:9px 12px;border-bottom:2px solid #E0D6EA;font-family:'Comfortaa',cursive;font-size:11px}
.tbl td{padding:9px 12px;border-bottom:1px solid #F0ECF4;cursor:pointer}.tbl tr:hover td{background:#FDFBFE}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar-track{height:20px;background:#F0ECF4;border-radius:4px;overflow:hidden;display:flex;flex:1}
.bar-seg{height:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;display:none}
.modal{background:#fff;border-radius:18px;max-width:720px;width:94%;max-height:88vh;overflow-y:auto;padding:28px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;font-family:'Manrope'}
.cal-day:hover{transform:scale(1.08)}.cal-real{background:rgba(22,163,74,.12);color:var(--g);font-weight:700}.cal-proy{background:rgba(107,45,139,.1);color:var(--p);font-weight:700}
header{background:#fff;border-bottom:1px solid #E8E0F0;padding:0 20px;position:sticky;top:0;z-index:50}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;height:50px}
main{max-width:1100px;margin:0 auto;padding:20px 20px 50px}
.hidden{display:none!important}
.si{font-family:'Manrope';border:1.5px solid #E0D6EA;border-radius:9px;padding:7px 12px;font-size:13px;background:#fff;outline:none;width:100%}.si:focus{border-color:var(--p)}
.update-info{font-size:10px;color:#999;font-family:'Manrope'}
.header-inner{height:auto;min-height:100px;}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.filters .si{flex:1;min-width:210px}.filters select{max-width:100%}.muted{font-size:12px;color:#73697c;margin:8px 0}.table-wrap{overflow-x:auto}.docs-table td{cursor:default;vertical-align:top}.docs-table td:first-child{min-width:260px}.format-pill,.file-icon{display:inline-block;background:#f2eaf7;color:#6b2d8b;border-radius:7px;padding:6px 8px;font-weight:700;font-size:11px}.measure-chips{display:flex;gap:5px;flex-wrap:wrap}.measure-chip{border:1px solid #ddcbe8;background:#f8f4fb;border-radius:7px;padding:5px 8px;cursor:pointer;color:#6b2d8b}.doc-download,.doc-open{display:inline-block;margin:3px 4px 3px 0;padding:6px 9px;border-radius:6px;background:#6b2d8b;color:white;text-decoration:none;font-size:12px}.doc-open{background:#f2eaf7;color:#6b2d8b}.doc-card{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid #e5dcec;border-left:4px solid #9a63b4;border-radius:8px;margin:10px 0;background:#fcfaff}.doc-title{font-size:13px;font-weight:600;overflow-wrap:anywhere}.doc-actions{margin-top:5px}.evidence-section{margin-top:20px}.evidence-section h3{font-size:15px}.calendar-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:14px}.calendar-toolbar h3{font-size:16px}.weekday{text-align:center;color:#776880;font-size:12px}.cal-day small{display:block;font-size:9px}.cal-selected{outline:2px solid #c2185b}.agenda-event{display:block;border:0;border-bottom:1px solid #eadfec;text-align:left;width:100%;background:transparent;padding:12px 0;cursor:pointer;font:inherit;font-size:12px}.agenda-event strong,.agenda-event span{display:block;margin-bottom:5px}.report-preview h1{font-size:22px}.report-preview h2{font-size:19px;margin:28px 0 14px;color:#6b2d8b}.report-preview h3{font-size:15px;margin:18px 0 10px}.report-preview h4{font-size:12px;color:#6b2d8b;margin:14px 0 6px}.report-preview p{font-size:13px;line-height:1.65}.pre{white-space:pre-wrap}.report-measure{border-top:2px solid #eee4f3;padding-top:10px;margin-top:20px}button:focus-visible,a:focus-visible{outline:3px solid #e8573a;outline-offset:3px}.btn:disabled{opacity:.4;cursor:default}@media(max-width:700px){.header-inner{height:auto;min-height:65px;flex-wrap:wrap;padding:10px 0;gap:8px}#navbtns{overflow:auto;width:100%;order:3}.nav-btn{white-space:nowrap}.calendar-layout{grid-template-columns:1fr}.modal{padding:20px}.calendar-toolbar .btn{padding:6px}.docs-table td:first-child{min-width:190px}}
</style>
</head>
<body>

<div id="app">
<header><div class="header-inner">
<div style="display:flex;align-items:center;gap:18px"><img src="assets/red-kuorum.png" alt="Red Kuorum · Asistencia técnica" style="width:160px;height:72px;object-fit:contain"><img src="assets/ccasa.png" alt="CCASA · Centro de Cálculo de Álava" style="width:160px;height:72px;object-fit:contain"></div>
<nav id="navbtns" style="display:flex;gap:3px"></nav>
<span class="update-info" id="updateInfo"></span>
</div></header>
<main>
<div style="margin-bottom:16px"><h1 class="hd" style="font-size:20px" id="ptitle">Panel de seguimiento</h1>
<p style="font-size:12px;color:#999;margin-top:3px" id="psub"></p></div>
<div class="card filters" style="align-items:center;justify-content:space-between"><div><strong>Excel de seguimiento del Plan</strong><p class="muted">La descarga corresponde a la misma versión de las medidas mostradas.</p></div><a class="btn btn-p" style="text-decoration:none" href="documentos/01.2%20Gestion%20Plan.xlsx" download="01.2 Gestion Plan.xlsx">Descargar Excel completo</a></div><div id="page-dash"></div><div id="page-med" class="hidden"></div><div id="page-cal" class="hidden"></div><div id="page-rep" class="hidden"></div><div id="page-doc" class="hidden"></div>
</main></div>

<div id="modal-bg" class="overlay"><div class="modal" id="modal-box" onclick="event.stopPropagation()"></div></div>

<script src="assets/jszip.min.js"></script><script src="data.js?v=documentos-2026"></script><script src="documents.js?v=documentos-2026"></script>
<script>
var calMonth=new Date().getMonth();
var calYear=new Date().getFullYear();
var aiC={};
var aiG='';
var PAGES=['dash','med','cal','rep'];
var PTITLES={dash:'Panel de seguimiento',med:'Detalle de medidas',cal:'Calendario',rep:'Informe del POA'};
var PLABELS={dash:'Dashboard',med:'Medidas',cal:'Calendario',rep:'Informe'};

function parseDates(txt){if(!txt)return[];if(txt instanceof Date&&!isNaN(txt))return[txt];var parts=txt.toString().trim().split(';');var dates=[];for(var i=0;i<parts.length;i++){var p=parts[i].trim();if(!p)continue;var m=p.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){var y=parseInt(m[3]);if(y<100)y+=2000;dates.push(new Date(y,parseInt(m[2])-1,parseInt(m[1])));continue;}m=p.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)dates.push(new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])));}return dates;}
function gS(s){var v=(s||'').toLowerCase().trim();if(v==='realizada')return{c:'#16A34A',cls:'b-r',l:'Realizada'};if(v==='en curso')return{c:'#D97706',cls:'b-c',l:'En curso'};return{c:'#64748B',cls:'b-p',l:'Por abordar'};}
function bdg(s){var st=gS(s);return '<span class="badge '+st.cls+'">'+st.l+'</span>';}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function short(s,n){return(s||'').substring(0,n);}
function getAreas(d){var a=[];var seen={};var arr=d||DATA;for(var i=0;i<arr.length;i++){var v=arr[i].area;if(v&&!seen[v]){seen[v]=1;a.push(v);}}return a;}
function countS(arr){var r=0,c=0,p=0;for(var i=0;i<arr.length;i++){var l=gS(arr[i].cumplimiento).l;if(l==='Realizada')r++;else if(l==='En curso')c++;else p++;}return{r:r,c:c,p:p};}
function sumH(arr,k){var s=0;for(var i=0;i<arr.length;i++)s+=(parseFloat(arr[i][k])||0);return s;}

function openModal(idx){
  var d=DATA[idx];if(!d)return;
  var st=gS(d.cumplimiento);
  var num=(d.area||'').match(/^(\d+)\./);num=num?num[0]:'';
  var h='';
  h+='<div style="margin:-28px -28px 0 -28px;padding:24px 28px 20px;background:linear-gradient(135deg,'+st.c+'15,'+st.c+'05);border-bottom:3px solid '+st.c+';border-radius:18px 18px 0 0">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
  h+='<div style="flex:1"><span style="font-size:10px;font-weight:700;color:'+st.c+';text-transform:uppercase;letter-spacing:1px">Area '+num+'</span>';
  h+='<h2 class="hd" style="font-size:17px;margin:6px 0 10px;line-height:1.3;color:#1E1B2E">'+esc(d.medida)+'</h2>';
  h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+bdg(d.cumplimiento);
  if(d.responsable)h+='<span style="font-size:11px;color:#666;background:#fff;padding:3px 10px;border-radius:8px">'+esc(d.responsable)+'</span>';
  h+='</div></div>';
  h+='<button class="btn btn-g" onclick="closeModal()" style="padding:6px;font-size:20px;flex-shrink:0">&times;</button></div></div>';
  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 16px">';
  var metrics=[['F. proyectada',(d.fecha_proy||'').toString(),'#6B2D8B'],['F. realizada',(d.fecha_real||'').toString(),'#16A34A'],['Horas prog.',(d.horas_prog||'').toString(),'#C2185B'],['Horas reales',(d.horas_real||'').toString(),'#D97706'],['Presupuesto',d.presupuesto?d.presupuesto+' €':'','#E8573A']];
  for(var i=0;i<metrics.length;i++){if(!metrics[i][1])continue;h+='<div style="background:#F8F5FB;border-radius:10px;padding:10px 14px;flex:1;min-width:110px"><div style="font-size:9px;font-weight:700;color:'+metrics[i][2]+';text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">'+metrics[i][0]+'</div><div style="font-size:13px;font-weight:600;color:#333">'+esc(metrics[i][1])+'</div></div>';}
  h+='</div>';
  h+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">';
  h+='<div style="flex:1;min-width:240px;background:#F8F5FB;border-radius:12px;padding:16px;border-top:3px solid #6B2D8B">';
  h+='<div style="font-size:10px;font-weight:700;color:#6B2D8B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">&#9654; Accion proyectada</div>';
  h+='<div style="font-size:13px;line-height:1.7;color:#333;white-space:pre-wrap">'+(esc(d.desc_proy)||'<span style="color:#BBB">Sin descripcion</span>')+'</div></div>';
  var realColor=d.desc_real?'#16A34A':'#94A3B8';
  h+='<div style="flex:1;min-width:240px;background:'+(d.desc_real?'#F0FDF4':'#F8FAFC')+';border-radius:12px;padding:16px;border-top:3px solid '+realColor+'">';
  h+='<div style="font-size:10px;font-weight:700;color:'+realColor+';text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">&#10003; Accion realizada</div>';
  h+='<div style="font-size:13px;line-height:1.7;color:#333;white-space:pre-wrap">'+(esc(d.desc_real)||'<span style="color:#BBB">Sin realizar</span>')+'</div></div>';
  h+='</div>';
  if(d.tareas&&d.tareas!=='Sin tareas pendientes'){
    h+='<div style="background:#FFFBEB;border-radius:12px;padding:16px;margin-bottom:16px;border-left:3px solid #D97706">';
    h+='<div style="font-size:10px;font-weight:700;color:#D97706;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">&#9888; Tareas pendientes</div>';
    h+='<div style="font-size:13px;line-height:1.7;color:#92400E;white-space:pre-wrap">'+esc(d.tareas)+'</div></div>';}
  var extras=[];
  if(d.indicador)extras.push(['Indicador de seguimiento',d.indicador]);
  if(d.meta)extras.push(['Meta estrategica',d.meta]);
  if(d.evidencia)extras.push(['Documentos de evidencia',d.evidencia]);
  if(d.desc_estado)extras.push(['Descripcion de estado',d.desc_estado]);
  if(extras.length){h+='<div style="border-top:1px solid #F0ECF4;padding-top:14px">';
    for(var i=0;i<extras.length;i++){h+='<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:700;color:#6B2D8B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">'+extras[i][0]+'</div><div style="font-size:12px;line-height:1.6;color:#555;white-space:pre-wrap">'+esc(extras[i][1])+'</div></div>';}
    h+='</div>';}
  document.getElementById('modal-box').innerHTML=h;
  document.getElementById('modal-bg').style.display='flex';
}
function closeModal(){document.getElementById('modal-bg').style.display='none';}
document.getElementById('modal-bg').onclick=function(){closeModal();};

function showPage(p){
  for(var i=0;i<PAGES.length;i++){
    document.getElementById('page-'+PAGES[i]).className=(PAGES[i]===p)?'':'hidden';
    var btns=document.querySelectorAll('.nav-btn');
    for(var j=0;j<btns.length;j++){btns[j].className='nav-btn'+(btns[j].getAttribute('data-page')===p?' nav-active':'');}
  }
  document.getElementById('ptitle').textContent=PTITLES[p];
}

function buildNav(){
  var nav=document.getElementById('navbtns');
  var h='';
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    h+='<button class="nav-btn'+(p==='dash'?' nav-active':'')+'" data-page="'+p+'" onclick="showPage(\''+p+'\')">'+PLABELS[p]+'</button>';
  }
  nav.innerHTML=h;
}

function renderDash(){
  var areas=getAreas();
  var h='<div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center">';
  h+='<select class="sel" id="da" onchange="renderDC()"><option value="">Todas las áreas</option>';
  for(var i=0;i<areas.length;i++)h+='<option value="'+esc(areas[i])+'">'+esc(areas[i])+'</option>';
  h+='</select></div><div id="dc"></div>';
  document.getElementById('page-dash').innerHTML=h;
  renderDC();
}

function renderDC(){
  var fa=(document.getElementById('da')||{}).value||'';
  var fd=[];for(var i=0;i<DATA.length;i++){if(!fa||DATA[i].area===fa)fd.push(DATA[i]);}
  var s=countS(fd);var hp=sumH(fd,'horas_prog');var hr=sumH(fd,'horas_real');
  var now=new Date();now.setHours(0,0,0,0);
  var overdue=[];
  for(var i=0;i<fd.length;i++){
    var cumpl=gS(fd[i].cumplimiento).l;
    if(cumpl==='Realizada')continue;
    var ds=parseDates(fd[i].fecha_proy);
    for(var j=0;j<ds.length;j++){if(ds[j]<now){overdue.push(fd[i]);break;}}
  }

  var h='<div class="kpi">';
  h+=kpi('Medidas activas',fd.length,'#6B2D8B')+kpi('Realizadas',s.r,'#16A34A')+kpi('En curso',s.c,'#D97706')+kpi('Por abordar',s.p,'#64748B');
  h+='</div>';
  h+='<div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap"><div class="card" style="padding:8px 16px;font-size:12px;color:#666;margin-bottom:0">Horas prog: <b style="color:#6B2D8B">'+hp+'</b></div><div class="card" style="padding:8px 16px;font-size:12px;color:#666;margin-bottom:0">Horas reales: <b style="color:#16A34A">'+hr+'</b></div></div>';

  if(overdue.length>0){
    h+='<div class="card" style="border-left:3px solid #E8573A;background:#FFF7ED"><b style="color:#E8573A;font-size:12px">&#9888; '+overdue.length+' medida'+(overdue.length>1?'s':'')+' con fecha superada</b><br>';
    for(var i=0;i<overdue.length;i++){var idx=DATA.indexOf(overdue[i]);h+='<span style="cursor:pointer;color:#92400E;font-size:11px" onclick="openModal('+idx+')">- '+esc(short(overdue[i].medida,80))+'</span><br>';}
    h+='</div>';
  }

  h+='<div class="card"><h3 class="hd" style="font-size:13px;margin-bottom:12px">Estado por áreas</h3>';
  var areas=getAreas(fd);
  for(var a=0;a<areas.length;a++){
    var am=[];for(var i=0;i<fd.length;i++){if(fd[i].area===areas[a])am.push(fd[i]);}
    var cs=countS(am);var t=am.length||1;var num=(areas[a].match(/^(\d+)\./)||['',''])[1];
    h+='<div style="display:flex;align-items:center;margin-bottom:8px;font-size:12px"><span style="width:50px;font-weight:600;color:#666">A'+num+'</span><div class="bar-track"><div class="bar-seg" style="width:'+Math.round(cs.r/t*100)+'%;background:#16A34A"></div><div class="bar-seg" style="width:'+Math.round(cs.c/t*100)+'%;background:#D97706"></div><div class="bar-seg" style="width:'+Math.round(cs.p/t*100)+'%;background:#94A3B8"></div></div><span style="width:80px;text-align:right;font-size:11px;color:#888;padding-left:8px">'+cs.r+'/'+cs.c+'/'+cs.p+'</span></div>';
  }
  h+='<div style="font-size:10px;color:#888;margin-top:6px"><span style="color:#16A34A">&#9632;</span> Real / <span style="color:#D97706">&#9632;</span> Curso / <span style="color:#94A3B8">&#9632;</span> Pendiente</div></div>';

  var realizadas=[];var encurso=[];var porabordar=[];
  for(var i=0;i<fd.length;i++){var l=gS(fd[i].cumplimiento).l;if(l==='Realizada')realizadas.push(fd[i]);else if(l==='En curso')encurso.push(fd[i]);else porabordar.push(fd[i]);}

  function statusSection(title,icon,color,bgLight,items){
    var s='<div style="flex:1;min-width:280px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:18px">'+icon+'</span><h3 class="hd" style="font-size:14px;margin:0;color:'+color+'">'+title+'</h3><span style="background:'+color+';color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px">'+items.length+'</span></div>';
    if(!items.length){s+='<div class="card" style="padding:20px;text-align:center;color:#BBB;font-size:12px;border-top:3px solid '+color+'">Sin medidas</div>';return s+'</div>';}
    for(var i=0;i<items.length;i++){var d=items[i];var idx=DATA.indexOf(d);var num=(d.area||'').match(/^(\d+)\./);num=num?num[0]:'';
      s+='<div class="card" style="padding:14px 16px;cursor:pointer;border-left:3px solid '+color+';margin-bottom:8px" onclick="openModal('+idx+')">';
      s+='<div style="font-weight:700;font-size:12px;color:#1E1B2E;margin-bottom:4px;line-height:1.4">'+esc(short(d.medida,85))+'</div>';
      s+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
      s+='<span style="font-size:10px;color:#888;background:#F0ECF4;padding:2px 8px;border-radius:6px">Área '+num+'</span>';
      if(d.responsable)s+='<span style="font-size:10px;color:#888">'+esc(short(d.responsable,30))+'</span>';
      s+='</div></div>';}
    return s+'</div>';
  }

  h+='<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:4px">';
  h+=statusSection('Realizadas','&#10003;','#16A34A','#DCFCE7',realizadas);

calendarEvents=function(){var events=baseCalendarEvents();DATA.forEach(function(d,i){if(d.desc_real&&!events.some(function(e){return e.idx===i&&e.type==='real';})){events.push({idx:i,type:'estimated',date:new Date(2026,9,9),label:'Avance registrado · fecha estimada para el calendario'});}});return events.sort(function(a,b){return a.date-b.date||a.idx-b.idx;});};

 calYear=2026;var ev=calendarEvents(),months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];var start=(new Date(2026,calMonth,1).getDay()+6)%7,days=new Date(2026,calMonth+1,0).getDate();
 var h='<div class="calendar-layout"><div class="card"><div class="calendar-toolbar"><button class="btn btn-g" '+(calMonth===0?'disabled':'')+' onclick="calMonth--;selectedCalDay=null;renderCC()">Anterior</button><h3 class="hd">'+months[calMonth]+' 2026</h3><button class="btn btn-g" '+(calMonth===11?'disabled':'')+' onclick="calMonth++;selectedCalDay=null;renderCC()">Siguiente</button></div><div class="cal-grid">'+['L','M','X','J','V','S','D'].map(function(x){return '<span class="weekday">'+x+'</span>';}).join('');for(var n=0;n<start;n++)h+='<span></span>';for(var day=1;day<=days;day++){var events=ev.filter(function(e){return e.date.getMonth()===calMonth&&e.date.getDate()===day;});h+='<button class="cal-day '+(events.some(function(e){return e.type==='real';})?'cal-real':events.length?'cal-proy':'')+(selectedCalDay===day?' cal-selected':'')+'" onclick="selectedCalDay='+day+';renderCC()" aria-label="'+day+' '+months[calMonth]+', '+events.length+' eventos">'+day+(events.length?'<small>'+events.length+'</small>':'')+'</button>';}h+='</div><p class="muted">Verde: fecha realizada · Morado: fecha proyectada o estimada. Los avances sin fecha se sitúan orientativamente el 9 de octubre, fecha de referencia de esta revisión. Selecciona un día para ver todos sus eventos.</p></div><div class="card"><h3 class="hd">'+(selectedCalDay?'Día '+selectedCalDay:'Agenda de '+months[calMonth])+'</h3>';
 var visible=ev.filter(function(e){return e.date.getMonth()===calMonth&&(!selectedCalDay||e.date.getDate()===selectedCalDay);});h+=visible.map(function(e){return '<button class="agenda-event" onclick="openModal('+e.idx+')"><span class="badge '+(e.type==='real'?'b-r':'b-p')+'">'+e.date.toLocaleDateString('es-ES')+' · '+(e.type==='real'?'Realizada':e.type==='estimated'?'Avance · fecha estimada':'Proyectada')+'</span><strong>'+esc(DATA[e.idx].medida)+'</strong></button>';}).join('')||'<p class="muted">Sin eventos registrados para esta selección.</p>';h+='</div></div>';
 var vague=DATA.filter(function(d){return /2026/.test(d.fecha_proy)&&!parseDates(d.fecha_proy).some(function(dt){return dt.getFullYear()===2026;});});if(vague.length)h+='<div class="card"><h3 class="hd">Actuaciones de 2026 sin día concreto</h3>'+vague.map(function(d){var text=String(d.fecha_proy).split(/2027/)[0].replace(/\s*[.;:]\s*$/,'');return '<button class="agenda-event" onclick="openModal('+DATA.indexOf(d)+')"><strong>'+esc(d.medida)+'</strong><span>'+esc(text)+'</span></button>';}).join('')+'</div>';document.getElementById('page-cal').innerHTML=h;
};

async function downloadEditedExcel(button,saveToFolder){var old=button.textContent;button.textContent='Preparando Excel…';try{
var handle=null;if(saveToFolder){if(!window.showSaveFilePicker)throw Error('Abre esta página en Microsoft Edge o Chrome para elegir la carpeta de destino.');handle=await window.showSaveFilePicker({suggestedName:'01.2 Gestion Plan.xlsx',types:[{description:'Libro de Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});}
var file=DOCUMENTS.find(d=>d.name==='01.2 Gestion Plan.xlsx');var response=await fetch(docURL(file));if(!response.ok)throw Error('No se pudo leer el Excel');var buffer=await response.arrayBuffer();
if(Object.keys(edits).length){var zip=await JSZip.loadAsync(buffer),parser=new DOMParser(),ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';var sheet=parser.parseFromString(await zip.file('xl/worksheets/sheet1.xml').async('string'),'application/xml');var shared=[];if(zip.file('xl/sharedStrings.xml')){var ss=parser.parseFromString(await zip.file('xl/sharedStrings.xml').async('string'),'application/xml');shared=Array.from(ss.getElementsByTagNameNS(ns,'si')).map(n=>Array.from(n.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent).join(''));}

var touched=0;Array.from(sheet.getElementsByTagNameNS(ns,'row')).forEach(row=>{var r=row.getAttribute('r'),cells=Array.from(row.children),id=value(cells.find(c=>c.getAttribute('r')==='C'+r)).split('. ')[0],patch=edits[id];if(!patch)return;touched++;Object.entries({desc_proy:'K',desc_real:'L',tareas:'M'}).forEach(([key,col])=>{var cell=cells.find(c=>c.getAttribute('r')===col+r);if(!cell){cell=sheet.createElementNS(ns,'c');cell.setAttribute('r',col+r);var after=cells.find(c=>c.getAttribute('r').replace(/\d/g,'')>col);row.insertBefore(cell,after||null);}cell.setAttribute('t','inlineStr');while(cell.firstChild)cell.removeChild(cell.firstChild);var is=sheet.createElementNS(ns,'is'),t=sheet.createElementNS(ns,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=patch[key];is.appendChild(t);cell.appendChild(is);});});if(touched!==Object.keys(edits).length)throw Error('No se han localizado todas las medidas editadas');zip.file('xl/worksheets/sheet1.xml',new XMLSerializer().serializeToString(sheet));buffer=await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});}
if(handle){var writable=await handle.createWritable();await writable.write(buffer);await writable.close();alert('Excel guardado en el archivo seleccionado, con las descripciones editadas.');return;}
var url=URL.createObjectURL(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),link=document.createElement('a');link.href=url;link.download='01.2 Gestion Plan.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
}catch(e){if(e.name==='AbortError')return;alert('No se ha podido descargar el Excel: '+e.message);}finally{button.textContent=old;}}

var linkedExcel=null,linkedStamp='',editingBaseline=null,syncBusy=false;
var syncColumns={area:'A',meta:'B',medida:'C',indicador:'D',responsable:'E',horas_prog:'G',desc_proy:'K',desc_real:'L',tareas:'M',evidencia:'N',fecha_proy:'O',fecha_real:'P',cumplimiento:'Q',horas_real:'R',presupuesto:'S',desc_estado:'V'};
function syncMessage(t){document.getElementById('excel-sync-state').textContent=t;}
async function readLocalBook(file){var bytes=await file.arrayBuffer(),zip=await JSZip.loadAsync(bytes),ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',parser=new DOMParser();var sheet=parser.parseFromString(await zip.file('xl/worksheets/sheet1.xml').async('string'),'application/xml'),shared=[];if(zip.file('xl/sharedStrings.xml')){var ss=parser.parseFromString(await zip.file('xl/sharedStrings.xml').async('string'),'application/xml');shared=Array.from(ss.getElementsByTagNameNS(ns,'si')).map(n=>Array.from(n.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent).join(''));}function value(c){if(!c)return '';if(c.getAttribute('t')==='s')return shared[Number(c.getElementsByTagNameNS(ns,'v')[0].textContent)];return c.textContent;}
var rows={};Array.from(sheet.getElementsByTagNameNS(ns,'row')).forEach(row=>{var n=row.getAttribute('r'),cells=Array.from(row.children),d={};Object.entries(syncColumns).forEach(([k,c])=>d[k]=value(cells.find(x=>x.getAttribute('r')===c+n)));if(/^\d+\.\d+\.\d+\. /.test(d.medida))rows[measureId(d)]={row,data:d};});if(!DATA.every(d=>rows[measureId(d)]))throw Error('El archivo no contiene las medidas del Plan de CCASA.');return {zip,sheet,rows,ns,bytes};}
async function refreshLinkedExcel(force){if(!linkedExcel||syncBusy||document.getElementById('edit-desc_real'))return;syncBusy=true;try{var f=await linkedExcel.getFile(),stamp=f.lastModified+':'+f.size;if(!force&&stamp===linkedStamp)return;var book=await readLocalBook(f);DATA.forEach(d=>Object.assign(d,book.rows[measureId(d)].data));linkedStamp=stamp;renderDC();renderMC();renderCC();renderRep();syncMessage('Conectado a '+linkedExcel.name+' · datos leídos del Excel de tu carpeta.');}catch(e){syncMessage('No se ha actualizado: '+e.message);}finally{syncBusy=false;}}
async function connectExcel(){try{if(!window.showOpenFilePicker)throw Error('Abre el dashboard en Edge o Chrome para conectar el Excel.');if(Object.keys(edits).length&&!confirm('Hay cambios guardados solo en este navegador. Descarga una copia antes de conectar si quieres conservarlos. ¿Continuar con el Excel de tu carpeta?'))return;var handles=await showOpenFilePicker({multiple:false,types:[{description:'Excel de gestión CCASA',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});var candidate=handles[0];if(candidate.name!=='01.2 Gestion Plan.xlsx')throw Error('Selecciona 01.2 Gestion Plan.xlsx en 3. Resultados entregados al cliente.');if(await candidate.requestPermission({mode:'readwrite'})!=='granted')throw Error('Falta permiso para guardar en el Excel seleccionado.');await readLocalBook(await candidate.getFile());linkedExcel=candidate;edits={};localStorage.removeItem(editKey);await refreshLinkedExcel(true);}catch(e){if(e.name!=='AbortError')syncMessage(e.message);}}

var browserSaveMeasure=saveMeasure;
saveMeasure=async function(i){if(!linkedExcel)return browserSaveMeasure(i);if(syncBusy)return;syncBusy=true;var message=document.getElementById('edit-message');try{var baseline=editingBaseline,id=measureId(DATA[i]),patch={};Object.keys(editableFields).forEach(k=>{var v=document.getElementById('edit-'+k).value;if(v!==baseline[k])patch[k]=v;});var f=await linkedExcel.getFile(),book=await readLocalBook(f),entry=book.rows[id];for(var k of Object.keys(patch))if(entry.data[k]!==baseline[k])throw Error('El campo «'+editableFields[k]+'» ha cambiado en el Excel. Conserva tu texto y vuelve a abrir la ficha para revisar ambas versiones.');
for(var k of Object.keys(patch)){var n=entry.row.getAttribute('r'),addr=syncColumns[k]+n,cell=Array.from(entry.row.children).find(c=>c.getAttribute('r')===addr);if(!cell){cell=book.sheet.createElementNS(book.ns,'c');cell.setAttribute('r',addr);var after=Array.from(entry.row.children).find(c=>c.getAttribute('r').replace(/\d/g,'')>syncColumns[k]);entry.row.insertBefore(cell,after||null);}cell.setAttribute('t','inlineStr');while(cell.firstChild)cell.removeChild(cell.firstChild);var is=book.sheet.createElementNS(book.ns,'is'),t=book.sheet.createElementNS(book.ns,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=patch[k];is.appendChild(t);cell.appendChild(is);}
book.zip.file('xl/worksheets/sheet1.xml',new XMLSerializer().serializeToString(book.sheet));var bytes=await book.zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});var fresh=await linkedExcel.getFile();if(fresh.lastModified!==f.lastModified||fresh.size!==f.size)throw Error('El Excel cambió mientras guardabas. Inténtalo de nuevo.');var stream=await linkedExcel.createWritable();await stream.write(bytes);await stream.close();Object.assign(DATA[i],entry.data,patch);editingBaseline=null;openModal(i);syncMessage('Guardado en '+linkedExcel.name+' de tu carpeta OneDrive.');document.getElementById('modal-box').insertAdjacentHTML('beforeend','<p role="status">Cambios guardados directamente en el Excel conectado.</p>');}catch(e){message.textContent='No se ha guardado: '+e.message;}finally{syncBusy=false;}};
