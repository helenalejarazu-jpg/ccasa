<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de formación con perspectiva de género · CCASA 2025</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7B2D8E;--magenta:#C62270;--orange:#D85A30;--dark:#2D2D2D;--gray:#555;--light:#F8F5FA;--purpleL:#E8D5F0;--magentaL:#F5D6E8;--orangeL:#FCEADE;--green:#2E7D32;--greenL:#E8F5E9;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans','Segoe UI',sans-serif;color:var(--dark);background:#f5f3f7;padding:20px}
.wrap{max-width:880px;margin:0 auto;background:var(--white);border-radius:14px;box-shadow:0 4px 30px rgba(123,45,142,.08);overflow:hidden}
.header{background:linear-gradient(135deg,var(--purple) 0%,var(--magenta) 60%,var(--orange) 100%);padding:28px 30px 24px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.header .tag{color:rgba(255,255,255,.65);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.header h1{font-family:'Comfortaa',sans-serif;color:#fff;font-size:21px;margin:4px 0 2px;font-weight:700}
.header .sub{color:rgba(255,255,255,.85);font-size:13px}
.content{padding:20px 28px 30px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--purpleL);margin-bottom:22px;flex-wrap:wrap}
.tab-btn{font-family:'Comfortaa',sans-serif;font-size:11px;font-weight:500;color:var(--gray);background:transparent;border:none;padding:8px 14px;cursor:pointer;border-radius:6px 6px 0 0;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{font-weight:700;color:var(--purple);background:var(--purpleL);border-bottom-color:var(--purple)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.section{margin-bottom:28px}
.section h3{font-family:'Comfortaa',sans-serif;font-size:16px;color:var(--purple);font-weight:700;margin-bottom:2px}
.section .subtitle{font-size:12px;color:var(--gray);line-height:1.4;margin-bottom:14px}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.metric{background:var(--purple);border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:12px 16px;flex:1;min-width:130}
.metric .val{font-size:24px;font-weight:800;font-family:'Comfortaa',sans-serif;line-height:1}
.metric .lbl{font-size:11px;font-weight:600;margin-top:4px;color:var(--dark)}
.metric .sub{font-size:10px;color:var(--gray);margin-top:2px}
.metric.purple{background:rgba(123,45,142,.04);border-left-color:var(--purple)}.metric.purple .val{color:var(--purple)}
.metric.magenta{background:rgba(198,34,112,.04);border-left-color:var(--magenta)}.metric.magenta .val{color:var(--magenta)}
.metric.orange{background:rgba(216,90,48,.04);border-left-color:var(--orange)}.metric.orange .val{color:var(--orange)}
.accordion{margin-bottom:10px;border:1px solid var(--purpleL);border-radius:8px;overflow:hidden}
.accordion-btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--light);border:none;padding:12px 16px;cursor:pointer;text-align:left;transition:all .2s}
.accordion-btn.open{background:linear-gradient(135deg,rgba(123,45,142,.06),rgba(198,34,112,.06))}
.accordion-btn span:first-child{font-family:'Comfortaa',sans-serif;font-size:13px;font-weight:700;color:var(--purple)}
.accordion-btn .arrow{font-size:18px;color:var(--purple);transition:transform .2s}
.accordion-btn.open .arrow{transform:rotate(180deg)}
.accordion-body{padding:16px 18px;font-size:13px;line-height:1.7;color:var(--dark);display:none}
.accordion-body.open{display:block}
.prose{font-size:13px;line-height:1.7;color:var(--dark)}
.prose p{margin-bottom:10px}
.prose b,.prose strong{color:var(--purple)}
.b-mag{color:var(--magenta)!important}
.b-ora{color:var(--orange)!important}
.b-grn{color:var(--green)!important}
.meta-card{background:var(--light);border-radius:8px;padding:12px 16px;margin-bottom:8px}
.meta-card .meta-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.meta-card .meta-title{font-size:13px;font-weight:600;color:var(--dark);margin:4px 0 6px}
.meta-card .meta-med{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:3px;padding-left:10px;border-left:1px solid var(--purpleL)}
.rk-table{width:100%;border-collapse:collapse;font-size:11px;border-radius:8px;overflow:hidden;border:1px solid var(--purpleL)}
.rk-table thead th{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;padding:8px 6px;font-weight:700;font-size:10px;letter-spacing:.3px;white-space:nowrap;text-align:center}
.rk-table thead th:nth-child(2){text-align:left}
.rk-table tbody td{padding:6px 6px;color:var(--dark);border-bottom:1px solid rgba(232,213,240,.15);text-align:center}
.rk-table tbody td:nth-child(2){text-align:left;font-weight:600}
.rk-table tbody tr:nth-child(even){background:var(--light)}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px}
.tag-h{background:rgba(123,45,142,.1);color:var(--purple)}
.tag-m{background:rgba(198,34,112,.1);color:var(--magenta)}
.tag-eq{background:rgba(46,125,50,.1);color:var(--green)}
.tag-mh{background:rgba(216,90,48,.1);color:var(--orange)}
.tag-mm{background:rgba(198,34,112,.1);color:var(--magenta)}
.seg-cards{display:flex;gap:10px;flex-wrap:wrap}
.seg-card{flex:1;min-width:160px;border-radius:10px;padding:14px;text-align:center}
.seg-card .seg-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.seg-card .seg-nums{display:flex;justify-content:center;gap:16px}
.seg-card .seg-big{font-size:24px;font-weight:800;font-family:'Comfortaa',sans-serif}
.seg-card .seg-sm{font-size:9px;color:var(--gray)}
.seg-card .seg-total{margin-top:6px;font-size:10px;color:var(--gray)}
.impact-cards{display:flex;gap:10px;flex-wrap:wrap}
.impact-card{flex:1;min-width:180px;border-radius:10px;padding:14px}
.impact-card .imp-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.impact-card .imp-row{display:flex;gap:14px}
.impact-card .imp-label{font-size:10px;color:var(--gray)}
.impact-card .imp-val{font-size:18px;font-weight:800;font-family:'Comfortaa',sans-serif}
.impact-card .imp-pct{font-size:11px;font-weight:400}
.delta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.delta-card{background:var(--greenL);border-radius:8px;padding:10px 12px;border-left:3px solid var(--green)}
.delta-card .d-label{font-size:10px;color:var(--gray);font-weight:600;margin-bottom:4px}
.delta-card .d-row{display:flex;align-items:baseline;gap:6px}
.delta-card .d-old{font-size:11px;color:var(--gray)}
.delta-card .d-arrow{font-size:12px;color:var(--gray)}
.delta-card .d-new{font-size:15px;font-weight:800;color:var(--dark)}
.delta-card .d-delta{font-size:10px;font-weight:700;color:var(--green);background:#C8E6C9;padding:1px 5px;border-radius:4px}
.att-card{border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:10px}
.att-card .att-title{font-size:13px;font-weight:700;margin-bottom:4px}
.att-card .att-text{font-size:12.5px;line-height:1.6}
.proposal{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.proposal .tag{flex-shrink:0}
.proposal span{font-size:12.5px;line-height:1.6}
.chart-box{margin:14px 0;position:relative}
canvas{max-width:100%}
.footer{border-top:2px solid var(--purpleL);margin-top:28px;padding-top:10px;text-align:center}
.footer p{font-size:9px;color:var(--gray)}
@media(max-width:600px){.delta-grid{grid-template-columns:1fr}.metrics{flex-direction:column}.seg-cards{flex-direction:column}.impact-cards{flex-direction:column}.tab-btn{font-size:10px;padding:6px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="tag">Red Kuorum · Asistencia Técnica Igualdad</div>
    <h1>Informe de formación con perspectiva de género</h1>
    <div class="sub">CCASA · Datos 2025 · III Plan de Igualdad 2026-2029</div>
  </div>
  <div class="content">
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="0">Introducción</button>
      <button class="tab-btn" data-tab="1">Visión general</button>
      <button class="tab-btn" data-tab="2">Cursos</button>
      <button class="tab-btn" data-tab="3">Seminarios</button>
      <button class="tab-btn" data-tab="4">Evolución</button>
      <button class="tab-btn" data-tab="5">Conclusiones</button>
    </div>
    <!-- TAB 0: INTRODUCCION -->
    <div class="tab-panel active" id="panel-0">
      <div class="section">
        <h3>Contexto y antecedentes</h3>
        <div class="prose">
          <p>El análisis de la formación desde la perspectiva de género constituye un ejercicio continuado que CCASA viene realizando de manera sistemática. Durante la vigencia del <strong>II Plan de Igualdad (2021-2024)</strong>, se analizaron los datos correspondientes a los años 2022 y 2023, estableciendo una primera serie histórica sobre la participación de mujeres y hombres en las acciones formativas.</p>
          <p>Posteriormente, en el marco de la elaboración del <strong class="b-mag">diagnóstico</strong> que sirvió de base para el III Plan de Igualdad, se incorporaron los datos de 2024.</p>
          <p>El presente informe se elabora en <strong>2026</strong>, primer año de vigencia del <strong>III Plan de Igualdad de Mujeres y Hombres de CCASA (2026-2029)</strong>, y analiza los datos de formación correspondientes al ejercicio <strong class="b-mag">2025</strong> —el año inmediatamente anterior a la entrada en vigor del plan—. Se dispone así de una línea de base actualizada desde la que medir el impacto de las nuevas medidas.</p>
        </div>
      </div>
      <div class="section">
        <h3>Encuadre en el III Plan de Igualdad</h3>
        <div class="prose"><p>El III Plan estructura la formación en el <strong>Área 3: Formación y Capacitación con Perspectiva de Género</strong>, que se despliega en tres metas y seis medidas:</p></div>
        <div class="meta-card" style="border-left:3px solid var(--purple)">
          <div class="meta-tag" style="color:var(--purple)">Meta 3.1</div>
          <div class="meta-title">Dotar al personal de los conocimientos necesarios para introducir la perspectiva de género en su actividad</div>
          <div class="meta-med">3.1.1. Formación mixta anual a toda la plantilla: legislación en igualdad, igualdad en la tecnología, perspectiva de género en proyectos, elaboración de EIG, comunicación inclusiva, prevención de violencia digital, liderazgo igualitario.</div>
        </div>
        <div class="meta-card" style="border-left:3px solid var(--magenta)">
          <div class="meta-tag" style="color:var(--magenta)">Meta 3.2</div>
          <div class="meta-title">Proporcionar espacios formativos que transformen las relaciones de género</div>
          <div class="meta-med">3.2.1. Formación anual para mujeres: empoderamiento profesional, liderazgo y gestión de la autoridad en entornos masculinizados.</div>
          <div class="meta-med">3.2.2. Formación anual para hombres: nuevas masculinidades, corresponsabilidad, prevención de la violencia machista.</div>
        </div>
        <div class="meta-card" style="border-left:3px solid var(--orange)">
          <div class="meta-tag" style="color:var(--orange)">Meta 3.3</div>
          <div class="meta-title">Introducir la perspectiva de género en toda la formación externa contratada o financiada por CCASA</div>
          <div class="meta-med">3.3.1. Incorporar cláusulas de igualdad en todos los contratos de formación externa.</div>
          <div class="meta-med">3.3.2. Solicitar informe previo a las entidades proveedoras sobre integración de la perspectiva de género.</div>
          <div class="meta-med">3.3.3. Elaborar un informe anual sobre las formaciones externas: participantes desagregados por sexo, valoración del cumplimiento de las cláusulas.</div>
        </div>
        <div class="prose"><p>El presente informe responde directamente a la <strong class="b-ora">Medida 3.3.3</strong> y proporciona la información de base para evaluar el cumplimiento progresivo de las tres metas del Área 3.</p></div>
      </div>
      <div class="accordion">
        <button class="accordion-btn" onclick="toggleAccordion(this)"><span>La paradoja detectada en el diagnóstico</span><span class="arrow">▾</span></button>
        <div class="accordion-body">
          <div class="prose">
            <p>El diagnóstico previo al III Plan detectó una <strong class="b-mag">paradoja significativa</strong>: durante el periodo 2022-2024, la participación numérica de las mujeres en las acciones formativas evolucionó positivamente, pero las horas acumuladas eran sistemáticamente inferiores a las proporcionales.</p>
            <p>En cursos: participación femenina del 39% en 2022, 40% en 2023, 44% en 2024. Pero las horas se situaban entre 3 y 4 puntos por debajo de la proporción en la plantilla.</p>
            <p>El III Plan señala que esta brecha horaria tiene <strong>impacto directo sobre las oportunidades de desarrollo profesional y promoción</strong>, dado que la formación acumulada puede representar hasta 16 de 30 puntos en las fases de valoración de méritos.</p>
          </div>
        </div>
      </div>
      <div class="accordion">
        <button class="accordion-btn" onclick="toggleAccordion(this)"><span>Información analizada y fuentes</span><span class="arrow">▾</span></button>
        <div class="accordion-body">
          <div class="prose">
            <p>La información procede del <strong>Balance de Formación 2025</strong> elaborado por el Área de Recursos Humanos de CCASA (marzo 2026). Recoge la totalidad de las acciones formativas —16 cursos y 13 seminarios—, participantes desagregados por sexo y horas de formación.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 1: VISION GENERAL -->
    <div class="tab-panel" id="panel-1">
      <div class="metrics">
        <div class="metric purple"><div class="val">2.460,5</div><div class="lbl">Horas totales</div><div class="sub">Cursos + Seminarios</div></div>
        <div class="metric magenta"><div class="val">44%</div><div class="lbl">% horas mujeres</div><div class="sub">vs 41% plantilla → +3pp</div></div>
        <div class="metric orange"><div class="val">29</div><div class="lbl">Actividades</div><div class="sub">16 cursos · 13 seminarios</div></div>
      </div>
      <div class="accordion">
        <button class="accordion-btn" onclick="toggleAccordion(this)"><span>Datos generales (texto)</span><span class="arrow">▾</span></button>
        <div class="accordion-body">
          <div class="prose">
            <p>La plantilla de CCASA a lo largo de 2025 estuvo compuesta por <strong>144 personas</strong>: 85 hombres (59%) y 59 mujeres (41%). El total de horas asciende a <strong class="b-mag">2.460,5</strong>, de las cuales 1.378 corresponden a hombres (56%) y 1.082,5 a mujeres (44%). Las mujeres han recibido unas 74 horas más de lo proporcional.</p>
          </div>
        </div>
      </div>
      <div class="section">
        <h3>Participación por sexo: plantilla vs formación</h3>
        <div class="chart-box"><canvas id="chartParticipacion" height="280"></canvas></div>
      </div>
      <div class="section">
        <h3>Horas reales vs proporcionales</h3>
        <div class="chart-box"><canvas id="chartHoras" height="280"></canvas></div>
      </div>
      <div class="section">
        <h3>Segregación por sexo en las acciones formativas</h3>
        <div class="seg-cards">
          <div class="seg-card" style="background:rgba(123,45,142,.04);border:1px solid rgba(123,45,142,.2)">
            <div class="seg-label" style="color:var(--purple)">Solo hombres</div>
            <div class="seg-nums"><div><div class="seg-big" style="color:var(--purple)">5</div><div class="seg-sm">cursos</div></div><div><div class="seg-big" style="color:var(--purple)">5</div><div class="seg-sm">semin.</div></div></div>
            <div class="seg-total">307 h totales</div>
          </div>
          <div class="seg-card" style="background:rgba(198,34,112,.04);border:1px solid rgba(198,34,112,.2)">
            <div class="seg-label" style="color:var(--magenta)">Solo mujeres</div>
            <div class="seg-nums"><div><div class="seg-big" style="color:var(--magenta)">2</div><div class="seg-sm">cursos</div></div><div><div class="seg-big" style="color:var(--magenta)">2</div><div class="seg-sm">semin.</div></div></div>
            <div class="seg-total">105,5 h totales</div>
          </div>
          <div class="seg-card" style="background:rgba(46,125,50,.04);border:1px solid rgba(46,125,50,.2)">
            <div class="seg-label" style="color:var(--green)">Mixtos</div>
            <div class="seg-nums"><div><div class="seg-big" style="color:var(--green)">9</div><div class="seg-sm">cursos</div></div><div><div class="seg-big" style="color:var(--green)">6</div><div class="seg-sm">semin.</div></div></div>
            <div class="seg-total">2.048 h totales</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: CURSOS -->
    <div class="tab-panel" id="panel-2">
      <div class="metrics">
        <div class="metric purple"><div class="val">81</div><div class="lbl">Participantes</div><div class="sub">46 hombres · 35 mujeres</div></div>
        <div class="metric magenta"><div class="val">2.197,5</div><div class="lbl">Horas totales</div><div class="sub">H: 1.223 · M: 974,5</div></div>
        <div class="metric orange"><div class="val">43,2%</div><div class="lbl">% mujeres</div><div class="sub">vs 41% plantilla → +2,2pp</div></div>
      </div>
      <div class="section">
        <h3>Detalle de cursos 2025</h3>
        <div style="overflow-x:auto" id="cursosTable"></div>
      </div>
      <div class="section">
        <h3>Cursos con mayor dedicación horaria</h3>
        <div class="chart-box"><canvas id="chartTopCursos" height="300"></canvas></div>
      </div>
      <div class="accordion">
        <button class="accordion-btn" onclick="toggleAccordion(this)"><span>Análisis detallado (texto)</span><span class="arrow">▾</span></button>
        <div class="accordion-body">
          <div class="prose">
            <p>La participación femenina <strong class="b-mag">supera en 2,2 puntos</strong> su presencia en la plantilla. Las horas (44,3%) también superan la proporción. <strong class="b-grn">Se invierte la tendencia del diagnóstico</strong>.</p>
            <p>En 2025 <strong class="b-ora">no se han ofertado formaciones a toda la plantilla</strong>.</p>
            <p><strong>Formaciones exclusivamente masculinas:</strong> Máster Data Analytics (60h), BusinessObjects BI (63h), Contratación Pública (60h), SPDUG (48h) y Data Saturdays (7h). Total: 238 horas (10,8%).</p>
            <p><strong>Formaciones exclusivamente femeninas:</strong> FileNet (10,5h) y Figma Domestika (74h). Total: 84,5 horas (3,8%).</p>
            <p><strong class="b-mag">Formación en inglés:</strong> Mayor número de participantes (16) y horas (560). Mujeres mayoría: 9 vs 7 hombres, 315h vs 245h.</p>
            <p><strong>Equilibradas:</strong> ISO 9001, Auditoría ISO, AOL y F5 iRules (50%-50%). Administración al Fresco (80% mujeres). UiPath (41,7% mujeres).</p>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 3: SEMINARIOS -->
    <div class="tab-panel" id="panel-3">
      <div class="metrics">
        <div class="metric purple"><div class="val">83</div><div class="lbl">Participantes</div><div class="sub">45 hombres · 38 mujeres</div></div>
        <div class="metric magenta"><div class="val">263</div><div class="lbl">Horas totales</div><div class="sub">H: 155 · M: 108</div></div>
        <div class="metric orange"><div class="val">45,8%</div><div class="lbl">% mujeres</div><div class="sub">vs 41% plantilla → +4,8pp</div></div>
      </div>
      <div class="section">
        <h3>Detalle de seminarios 2025</h3>
        <div style="overflow-x:auto" id="seminariosTable"></div>
      </div>
      <div class="section">
        <h3>Impacto del seminario del Plan de Igualdad</h3>
        <div class="subtitle">El seminario Nº 6 concentra el 49,4% de las horas totales de seminarios.</div>
        <div class="impact-cards">
          <div class="impact-card" style="background:rgba(232,213,240,.35)">
            <div class="imp-tag" style="color:var(--purple)">Con Plan de Igualdad</div>
            <div class="imp-row">
              <div><div class="imp-label">H. hombres</div><div class="imp-val" style="color:var(--purple)">155 <span class="imp-pct">(58,9%)</span></div></div>
              <div><div class="imp-label">H. mujeres</div><div class="imp-val" style="color:var(--magenta)">108 <span class="imp-pct">(41,1%)</span></div></div>
            </div>
          </div>
          <div class="impact-card" style="background:var(--orangeL)">
            <div class="imp-tag" style="color:var(--orange)">Sin Plan de Igualdad</div>
            <div class="imp-row">
              <div><div class="imp-label">H. hombres</div><div class="imp-val" style="color:var(--purple)">87 <span class="imp-pct">(65,4%)</span></div></div>
              <div><div class="imp-label">H. mujeres</div><div class="imp-val" style="color:var(--magenta)">46 <span class="imp-pct">(34,6%)</span></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion">
        <button class="accordion-btn" onclick="toggleAccordion(this)"><span>Análisis detallado (texto)</span><span class="arrow">▾</span></button>
        <div class="accordion-body">
          <div class="prose">

function toggleAccordion(btn){

function compTag(h,m){
  if(h>0&&m===0)return'<span class="tag tag-h">Solo H</span>';
  if(m>0&&h===0)return'<span class="tag tag-m">Solo M</span>';
  const p=m/(h+m)*100;
  if(p>=40&&p<=60)return'<span class="tag tag-eq">Equilibrado</span>';
  if(p>60)return'<span class="tag tag-mm">Mayor\xeda M</span>';
  return'<span class="tag tag-mh">Mayor\xeda H</span>';
}

function buildTable(data,containerId){
  let html='<table class="rk-table"><thead><tr><th>N\xba</th><th>Actividad formativa</th><th>Fecha</th><th>H</th><th>M</th><th>h/p</th><th>Horas H</th><th>Horas M</th><th></th></tr></thead><tbody>';
  data.forEach(r=>{
    html+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[7]}</td><td>${r[5]||'\u2014'}</td><td>${r[6]||'\u2014'}</td><td>${compTag(r[3],r[4])}</td></tr>`;
  });
  html+='</tbody></table>';
  document.getElementById(containerId).innerHTML=html;
}
